name: Screenshots

# Boots the app with demo data and photographs every screen (phone and
# desktop, light and dark) for design review. The images are pushed to the
# branch "screenshots/<branch>" so they can be browsed on GitHub.

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      MAIL_MAILER: log
      PHP_CLI_SERVER_WORKERS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, intl, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 6
      - name: Take screenshots
        timeout-minutes: 8
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:8000/up > /dev/null && break; sleep 1; done
          node scripts/screenshots.mjs shots || echo "SCREENSHOT_PROBLEMS=1" >> "$GITHUB_ENV"
      - name: Publish to screenshots/${{ github.ref_name }}
        run: |
          target="screenshots/${GITHUB_REF_NAME}"
          cd shots
          git init -q -b "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Screenshots of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "![${f%.png}](${f})"; echo; done
          } > README.md
          git add -A
          git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${target}"
      - name: Fail if any page was broken
        if: env.SCREENSHOT_PROBLEMS == '1'
        run: |
          tail -n 60 storage/logs/laravel.log 2>/dev/null || true
          exit 1
      - if: failure()
        run: tail -n 80 storage/logs/serve.log storage/logs/*.log 2>/dev/null || true
